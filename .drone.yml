---
kind: pipeline
name: AS Email Django App Tests

steps:
  - name: test
    image: "python:3.13.13"
    environment:
      PYTHONUNBUFFERED: 1
      DEBUG: true
    commands:
      # Fresh throwaway key and salt for each run.
      - export DJANGO_SECRET_KEY=$$(openssl rand -hex 32) SALT_KEY=$$(openssl rand -hex 32)
      # Install uv via pip
      - pip install uv
      # Create venv and install all dependencies including dev
      - uv sync
      # Run Django commands and tests using uv run
      - cd ./app/
      - mkdir ./staticfiles
      - uv run python ./manage.py collectstatic --clear --no-input --verbosity 0
      - uv run python ./manage.py compress
      # Run tests with coverage and timing reports
      - uv run pytest --cov=as_email --cov-report=term-missing:skip-covered --durations=20
      # Display detailed coverage summary
      - echo "=== Coverage Summary ==="
      - uv run coverage report

---
kind: pipeline
name: Build linux/amd64

# Each architecture builds natively on a runner of that architecture and
# pushes one tag per target.  'Publish multi-arch manifests' joins them under
# the release tags.  ${DRONE_TAG##v} drops the tag's 'v', as auto_tag does.
platform:
  os: linux
  arch: amd64

depends_on:
  - AS Email Django App Tests

steps:
  - name: Build prod
    image: plugins/docker
    settings:
      username:
        from_secret: GHCR_USER
      password:
        from_secret: GHCR_PAT
      repo: ghcr.io/scanner/as_email_service
      registry: ghcr.io
      tags:
        - ${DRONE_TAG##v}-linux-amd64
      target: prod

  - name: Build dev
    image: plugins/docker
    settings:
      username:
        from_secret: GHCR_USER
      password:
        from_secret: GHCR_PAT
      repo: ghcr.io/scanner/as_email_service
      registry: ghcr.io
      tags:
        - ${DRONE_TAG##v}-dev-linux-amd64
      target: dev

trigger:
  event:
    - tag

---
kind: pipeline
name: Build linux/arm64

# Each architecture builds natively on a runner of that architecture and
# pushes one tag per target.  'Publish multi-arch manifests' joins them under
# the release tags.  ${DRONE_TAG##v} drops the tag's 'v', as auto_tag does.
platform:
  os: linux
  arch: arm64

depends_on:
  - AS Email Django App Tests

steps:
  - name: Build prod
    image: plugins/docker
    settings:
      username:
        from_secret: GHCR_USER
      password:
        from_secret: GHCR_PAT
      repo: ghcr.io/scanner/as_email_service
      registry: ghcr.io
      tags:
        - ${DRONE_TAG##v}-linux-arm64
      target: prod

  - name: Build dev
    image: plugins/docker
    settings:
      username:
        from_secret: GHCR_USER
      password:
        from_secret: GHCR_PAT
      repo: ghcr.io/scanner/as_email_service
      registry: ghcr.io
      tags:
        - ${DRONE_TAG##v}-dev-linux-arm64
      target: dev

trigger:
  event:
    - tag

---
kind: pipeline
name: Publish multi-arch manifests

depends_on:
  - Build linux/amd64
  - Build linux/arm64

steps:
  - name: Publish prod
    image: plugins/manifest
    settings:
      username:
        from_secret: GHCR_USER
      password:
        from_secret: GHCR_PAT
      spec: ci/manifest.tmpl
      auto_tag: true

  - name: Publish dev
    image: plugins/manifest
    settings:
      username:
        from_secret: GHCR_USER
      password:
        from_secret: GHCR_PAT
      spec: ci/manifest-dev.tmpl
      auto_tag: true

trigger:
  event:
    - tag

---
kind: pipeline
name: Build Notify

depends_on:
  - AS Email Django App Tests
  - Build linux/amd64
  - Build linux/arm64
  - Publish multi-arch manifests

trigger:
  status:
    - success
    - failure

steps:
  - name: slack notification
    image: plugins/slack
    settings:
      webhook:
        from_secret: slack_notify_webhook
      channel: builds
      username: drone
      template: >-
        {{#if build.pull }}
          *{{#success build.status }}✔{{ else }}✘{{/success }} {{ uppercasefirst build.status }}*: <https://github.com/{{ repo.owner }}/{{ repo.name }}/pull/{{ build.pull }}|Pull Request {{ build.pull }}>
        {{ else }}
          *{{#success build.status }}✔{{ else }}✘{{/success }} {{ uppercasefirst build.status }}: Build {{ build.number }}* (type: `{{ build.event }}`)
        {{/if }}

        Repository: <https://github.com/{{ repo.owner }}/{{ repo.name }}|{{ repo.name }}>

        Commit message: {{ build.message }}

        Commit: <https://github.com/{{ repo.owner }}/{{ repo.name }}/commit/{{ build.commit }}|{{ truncate build.commit 8 }}>

        Branch: <https://github.com/{{ repo.owner }}/{{ repo.name }}/commits/{{ build.branch }}|{{ build.branch }}>

        Author: {{ build.author }}

        Duration: {{ since build.started }}

        <{{ build.link }}|Visit build page ↗>
